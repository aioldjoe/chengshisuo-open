<!doctype html><meta charset="utf-8"><title>og</title>
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#F8F6F4;color:#383432;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:space-between;padding:0 96px;box-sizing:border-box;position:relative;overflow:hidden}
.ring{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:640px;height:640px;border:1px solid #D5A69A;border-radius:50%;opacity:.7}
.ring.b{width:460px;height:460px;right:50px}
.copy{position:relative;max-width:640px}
h1{margin:0 0 20px;font-size:76px;font-weight:600;letter-spacing:-.04em;line-height:1.18;color:#241F1D}
p{margin:0;font-size:26px;line-height:1.6;color:#81756D}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.seal{width:44px;height:44px;border-radius:26%;background:#B65A4A;color:#FFFDFC;display:grid;place-items:center;font:600 28px/1 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.brand b{font-size:24px;font-weight:600;letter-spacing:.12em;color:#383432}
.mark{position:relative;width:300px;height:300px;border-radius:26%;background:#B65A4A;color:#FFFDFC;display:grid;place-items:center;font:600 118px/1 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;letter-spacing:.03em;text-indent:.03em;flex:none}
</style>
<body>
<div class="ring"></div><div class="ring b"></div>
<div class="copy">
  <div class="brand"><span class="seal">成</span><b>成事所</b></div>
  <h1>會議記錄，<br>丟一段錄音的事。</h1>
  <p>把錄音傳進 LINE，幾分鐘後收到一條連結——摘要、決議、待辦、承諾、逐字稿都好了。零註冊。</p>
</div>
<div class="mark">成事</div>
</body>
